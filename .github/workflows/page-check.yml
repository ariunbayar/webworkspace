name: page-check
on:
  pull_request:
    paths: ['winlist/page/**', 'winlist/check_page.sh']
  push:
    branches: [main]
    paths: ['winlist/page/**', 'winlist/check_page.sh']
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: winlist/check_page.sh
