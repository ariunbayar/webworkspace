# Single-service demo. redis runs inside the same container (see Dockerfile.php /
# entrypoint) so the app's hard-coded 127.0.0.1:6379 needs no changes.
services:
  # PHP app: file browser, project management, open-in-editor. Self-contained
  # with its own redis (db 2), seeded with demo boxes.
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    ports:
      - "${PHP_PORT:-8081}:8081"
    environment:
      - DEMO_DIR=${PHP_DEMO_DIR:-/app}
    # php -S ignores SIGTERM (Docker's default stop signal), so stop waited the
    # full 10s grace before SIGKILL. SIGINT exits it cleanly; cap the wait.
    stop_signal: SIGINT
    stop_grace_period: 3s
