# Single-service demo. redis runs inside the same container (see Dockerfile /
# entrypoint) so runserver.py's hard-coded 127.0.0.1:6379 needs no changes.
services:
  web:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    # flask run ignores SIGTERM (Docker's default stop signal), so stop waited
    # the full 10s grace before SIGKILL. SIGINT exits it cleanly; cap the wait.
    stop_signal: SIGINT
    stop_grace_period: 3s
    environment:
      - PORT=8000
      - DEMO_DIR=${DEMO_DIR:-/app/static/js}
      - THUMB_FONT_SIZE=${THUMB_FONT_SIZE:-7}
